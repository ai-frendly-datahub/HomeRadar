[pytest]
testpaths = tests
# importlib mode does not add the repo root to sys.path. CI installs the
# packages, then cannot import the loose modules next to them.
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --verbose
    --color=yes
    --import-mode=importlib
    --cov=.
    --cov-report=term-missing
    --cov-report=html

markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
